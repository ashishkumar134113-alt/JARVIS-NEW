name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS-3.0.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract JARVIS project
        run: |
          rm -rf project
          mkdir project
          unzip -q JARVIS-3.0.zip -d project

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
